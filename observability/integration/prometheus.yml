global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dubbo-observability-server
    metrics_path: /prometheus
    static_configs:
      - targets: ["host.docker.internal:9099"]

  - job_name: dubbo-observability-client
    metrics_path: /prometheus
    static_configs:
      - targets: ["host.docker.internal:9098"]
